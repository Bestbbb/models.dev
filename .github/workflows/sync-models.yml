name: Sync Model Catalogs

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# sync runs repository code and provider API keys with a read-only token. It uploads each provider's result, report and
# catalog patch as data. publish runs only .github/sync-models/ from this commit with a models.dev automation app token
# from the automation environment: it applies each patch, allowing only catalog TOML, opens or updates the provider's
# pull request and auto-merges safe syncs. gaps runs only .github/sync-models/ too and starts Fill Catalog Gap for new
# gaps nobody is handling yet.
permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  providers:
    if: github.repository == 'anomalyco/models.dev'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.providers.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: dev
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: List sync providers
        id: providers
        run: |
          matrix="$(bun models:sync2 --list)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  sync:
    needs: providers
    if: github.repository == 'anomalyco/models.dev'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.providers.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: dev
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/models.dev-release
          role-session-name: models.dev-sync-${{ github.run_id }}
          aws-region: us-east-1

      - name: Fetch secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            ANTHROPIC_API_KEY,models.dev/release/ANTHROPIC_API_KEY
            BASETEN_API_KEY,models.dev/release/BASETEN_API_KEY
            CLOUDFLARE_WORKERS_AI_SYNC_API_TOKEN,models.dev/release/CLOUDFLARE_WORKERS_AI_SYNC_API_TOKEN
            DEEPINFRA_API_KEY,models.dev/release/DEEPINFRA_API_KEY
            DIGITALOCEAN_API_TOKEN,models.dev/release/DIGITALOCEAN_API_TOKEN
            FIREWORKS_API_KEY,models.dev/release/FIREWORKS_API_KEY
            GOOGLE_API_KEY,models.dev/release/GOOGLE_API_KEY
            MERGE_GATEWAY_API_KEY,models.dev/release/MERGE_GATEWAY_API_KEY
            MISTRAL_API_KEY,models.dev/release/MISTRAL_API_KEY
            NOVITA_AI_API_KEY,models.dev/release/NOVITA_AI_API_KEY
            OPENAI_API_KEY,models.dev/release/OPENAI_API_KEY
            OPENROUTER_API_KEY,models.dev/release/OPENROUTER_API_KEY
            XAI_API_KEY,models.dev/release/XAI_API_KEY
          parse-json-secrets: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync model catalog
        env:
          OUT: ${{ runner.temp }}/sync
          PROVIDER: ${{ matrix.provider }}
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
          BASETEN_API_KEY: ${{ env.BASETEN_API_KEY }}
          DEEPINFRA_API_KEY: ${{ env.DEEPINFRA_API_KEY }}
          DIGITALOCEAN_API_TOKEN: ${{ env.DIGITALOCEAN_API_TOKEN }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          FIREWORKS_API_KEY: ${{ env.FIREWORKS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENROUTER_API_KEY: ${{ env.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          LLMGATEWAY_API_KEY: ${{ secrets.LLMGATEWAY_API_KEY }}
          MERGE_GATEWAY_API_KEY: ${{ env.MERGE_GATEWAY_API_KEY }}
          MISTRAL_API_KEY: ${{ env.MISTRAL_API_KEY }}
          NOVITA_AI_API_KEY: ${{ env.NOVITA_AI_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          GOOGLE_API_KEY: ${{ env.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          XAI_API_KEY: ${{ env.XAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_WORKERS_AI_SYNC_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_WORKERS_AI_SYNC_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_SYNC_ACCOUNT_ID: ${{ vars.CLOUDFLARE_WORKERS_AI_SYNC_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_SYNC_API_TOKEN: ${{ env.CLOUDFLARE_WORKERS_AI_SYNC_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          bun models:sync2 "$PROVIDER" --json --report="$OUT/report.md" > "$OUT/result.json"
          jq -e '.provider and (.changes | type == "array") and (.gaps | type == "array")' "$OUT/result.json" > /dev/null
          tee -a "$GITHUB_STEP_SUMMARY" < "$OUT/report.md" > /dev/null

      - name: Validate models
        run: |
          if [ -n "$(git status --porcelain -- models providers)" ]; then bun validate; fi

      - name: Prepare upload
        env:
          OUT: ${{ runner.temp }}/sync
          PROVIDER: ${{ matrix.provider }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          printf '%s' "$PROVIDER" > "$OUT/provider"
          printf '%s' "$NAME" > "$OUT/name"
          jq -j '.risk.safe' "$OUT/result.json" > "$OUT/safe"
          if [ -n "$(git status --porcelain -- models providers)" ]; then
            git add models providers
            git -c user.name=sync -c user.email=sync@localhost commit -q --no-verify -m sync
            git diff --binary HEAD^ HEAD > "$OUT/changes.patch"
          fi

      - name: Upload result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sync-${{ matrix.provider }}
          path: ${{ runner.temp }}/sync
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [providers, sync]
    # Runs when some provider syncs failed, so the others still publish.
    if: always() && github.repository == 'anomalyco/models.dev' && needs.providers.result == 'success'
    runs-on: ubuntu-latest
    environment: automation

    steps:
      - name: Create app token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          repositories: models.dev
          permission-contents: write
          permission-pull-requests: write

      - name: Check out publish scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: /.github/sync-models/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Holds the push credential; nothing from this checkout runs.
      - name: Check out dev
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: dev
          path: repo
          token: ${{ steps.app.outputs.token }}

      - name: Download results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/sync
          pattern: sync-*

      - name: Publish
        working-directory: repo
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -uo pipefail
          BOT_NAME="${SLUG}[bot]"
          BOT_EMAIL="$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)+${SLUG}[bot]@users.noreply.github.com" || exit 1
          export BOT_NAME BOT_EMAIL
          failed=0
          for dir in "$RUNNER_TEMP"/sync/sync-*/; do
            [ -f "$dir/changes.patch" ] || continue
            bash ../trusted/.github/sync-models/publish.sh "$dir" || failed=1
          done
          exit "$failed"

  gaps:
    needs: [providers, sync]
    if: always() && github.repository == 'anomalyco/models.dev' && github.ref == 'refs/heads/dev' && needs.providers.result == 'success'
    runs-on: ubuntu-latest
    # The built-in token can start workflows (workflow_dispatch is the exception to its no-trigger rule) and read pull
    # requests; it can't push.
    permissions:
      actions: write
      contents: read
      pull-requests: read

    steps:
      - name: Check out gap scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: /.github/sync-models/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Only the ignore lists are read from here.
      - name: Check out dev ignore lists
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: dev
          path: repo
          sparse-checkout: /providers/*/sync-ignore.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/sync
          pattern: sync-*

      - name: Start gap runs
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GAP_LIMIT: 5
        run: bash ../trusted/.github/sync-models/dispatch-gaps.sh "$RUNNER_TEMP/sync"
